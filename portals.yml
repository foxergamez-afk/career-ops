# Portal Scanner Configuration — events, experiential & hospitality search (UK)
# Built from templates/portals.example.yml with every tech company removed.
#
# How the scanner covers these employers:
#   - Entries whose careers_url is an ATS board (Greenhouse, Workable, Teamtailor,
#     Workday, SmartRecruiters, iCIMS) are read by the zero-token scanner
#     (`npm run scan` / `node scan.mjs`).
#   - Entries with a branded careers page are opened in the browser by the agent
#     scan (`/career-ops scan` in Claude Code).
#   - Entries with scan_method: websearch are found through web search.
#   - search_queries at the bottom sweep UK events job boards and recruiters.
# Every careers URL here was checked on 2026-10-15.

# Previously seen postings come back after 30 days, so re-listed roles resurface.
scan_history:
  recheck_after_days: 30

# -- Title filter --
# A title must contain at least one positive keyword and no negative keyword
# (case-insensitive). " + " means all terms must appear, in any order.
title_filter:
  positive:
    # -- Events --
    - "stem:Event"       # Event, Events, Eventing — but not "Prevention"
    - "Conference"
    - "Exhibition"
    - "Festival"
    - "stem:Venue"       # not "Revenue"
    - "Live Experience"
    - "Production Assistant"
    - "Production Coordinator"
    - "Production Executive"
    - "Production Manager"
    - "Producer"
    # -- Experiential / brand activation --
    - "Experiential"
    - "Activation"
    - "Brand Experience"
    - "Brand Ambassador"
    - "Brand Partnerships"
    - "Sponsorship"
    - "Partnerships Executive"
    - "Partnerships Coordinator"
    - "Account Executive"
    - "Account Coordinator"
    - "Account Manager"
    - "Campaign Executive"
    - "Campaign Coordinator"
    - "Marketing Executive"
    - "Marketing Coordinator"
    - "Marketing Assistant"
    # -- Hospitality --
    - "Hospitality"
    - "Guest Experience"
    - "Front of House"
    - "Sales + Events"
    - "Operations + Event"
    - "Operations Coordinator"
    - "Operations Executive"
    - "Operations Assistant"
    # -- Project coordination --
    - "Project Coordinator"
    - "Project Executive"
    - "Project Assistant"
    # -- Early careers --
    - "Graduate"
    - "Placement"
    - "Junior + Event"
  negative:
    # -- Too senior for now --
    - "Director"
    - "Head of"
    - "word:VP"
    - "Vice President"
    - "Chief"
    # -- Kitchen and back-of-house roles on catering boards --
    - "Chef"
    - "Kitchen"
    - "Pastry"
    - "Cleaner"
    - "Cleaning"
    # -- Unrelated functions that share keywords --
    - "Accounts Payable"
    - "Accounts Receivable"
    - "Payroll"
    - "Software"
    - "Engineer"
    - "Developer"
    - "Pharmaceutical"
    - "Medical Science"
    - "Field Sales"
    - "Security Officer"
    - "Steward"
  seniority_boost:
    - "Junior"
    - "Assistant"
    - "Coordinator"
    - "Executive"
    - "Graduate"

# -- Location filter --
# UK only. A posting must name one of the `allow` places; anything else
# (US, Middle East, etc.) is dropped. Postings with no location still pass,
# and a title that says Remote is still let through.
location_filter:
  always_allow:
    - "London"
    - "United Kingdom"
  allow:
    - "London"
    - "United Kingdom"
    - "UK"
    - "GBR"
    - "England"
    - "Manchester"
    - "Birmingham"
    - "Leeds"
    - "Bristol"
    - "Brighton"
    - "Liverpool"
    - "Edinburgh"
    - "Glasgow"
    - "Norwich"
    - "Coventry"
  block_hard:
    - "United States"
    - "USA"
    - "Canada"
    - "Saudi Arabia"
    - "Riyadh"
    - "United Arab Emirates"
    - "Abu Dhabi"
    - "Dubai"
    - "Australia"

# -- Web search queries (UK events job boards and specialist recruiters) --
# These run in the agent scan. Search results can lag the live listing,
# so every hit is checked against the employer before it is evaluated.
search_queries:
  - name: Live Recruitment — events & experiential (London)
    query: 'site:live-recruitment.co.uk/job "Event" OR "Experiential" OR "Account Executive" London'
    enabled: true

  - name: Major Players — experiential agency roles
    query: 'site:majorplayers.co.uk/job "Experiential" OR "Event" OR "Activation"'
    enabled: true

  - name: DNA Recruit — experiential & events
    query: 'site:dnarecruit.com "Experiential" OR "Event Coordinator" OR "Account Executive" London'
    enabled: true

  - name: Caterer.com — events & hospitality (London)
    query: 'site:caterer.com "Events Coordinator" OR "Events Executive" OR "Events Assistant" OR "Event Sales" London'
    enabled: true

  - name: Hosco — events & hospitality (UK)
    query: 'site:hosco.com "Event" OR "Guest Experience" London'
    enabled: true

  - name: Bright Network — graduate events & experiential
    query: 'site:brightnetwork.co.uk/graduate-jobs "Event" OR "Experiential" OR "Account Executive" London'
    enabled: true

  - name: Built In London — events roles
    query: 'site:builtinlondon.uk/job "Events Coordinator" OR "Events Executive" OR "Event Producer" OR "Experiential"'
    enabled: true

  - name: Find a Job (DWP) — events roles in London
    query: 'site:findajob.dwp.gov.uk "Events Coordinator" OR "Events Assistant" OR "Event Executive" London'
    enabled: true

  - name: ATS boards — experiential & events in London
    query: 'site:job-boards.greenhouse.io OR site:apply.workable.com OR site:teamtailor.com "Experiential" OR "Event Coordinator" OR "Event Producer" London'
    enabled: true

